title = "Encounter Lab: default rules with reviewed scientific digest exceptions"

[extend]
useDefault = true

# All 39 initial historical generic-api-key findings are row_hash SHA256 values,
# generated by src/window_cohort.py, not authentication credentials.
# Exact known digests + exact metadata fields + five frozen paths; no commit/path-wide suppression.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Reviewed frozen sample/key SHA256 metadata only"
condition = "AND"
regexTarget = "line"
paths = [
    '''(?:^|/)reports/window_study/PROTOCOL_FROZEN\.json$''',
    '''(?:^|/)reports/window_study/T19_COHORT_MANIFEST\.json$''',
    '''(?:^|/)reports/window_study/T21_RESULTS\.json$''',
    '''(?:^|/)reports/window_study/T22_PROTOCOL_FROZEN\.json$''',
    '''(?:^|/)reports/window_study/T22_ROBUSTNESS\.json$''',
]
regexes = [
    '''^\s*"(?:sample_key_hash|key_hash)"\s*:\s*"(?:02a1d86957d15256d716ec0a7808ffeef191d4ee8a3dd5858c30341a1841090e|1159f6d462b8605f9597bb6952effd680aeec538b79d90f4b9959e67a84fd610|1950cb6f236692d02c8972b811b4e072f2f673a5c42640bac364e83a4e6a0dbd|1e9d4ba7c214ce32346daefef31a9d6e684191930a84b329a403c5e90c473d92|230b13b77375d652af7f8349e7dd3c65cfaf3964fb7e4359acf0e910af5793d8|80b64b83ce5628da54f204a9aec5076f3a11775ca91cc54c41367fa89c4c8047|a78a878936da5405f2d5ab419d25ee4bff9824be70fd14f43f7f4b60aa951f30|bcd86090dd9c812816f5de420fd1eb247ebfff988425990167b15386a149a977|ca997435557bad1a48b8f00bec089125fcb4a6d9642675b0ecd975bbf523c68b|da1a01aa8618e7b60bc65f9c8e5d8778acb46ee4df15c7a16d854bd091557b75|dae4b7248abe8dfff0133cb5ef8485b2b9f1075abd7dc611e2297a64a3614be1|e6f5f9fc19dabcc7908fbf083b549dd733eb27b1ff740123ff25ddaac8acd535|ecf16e302e3896aed69abbcec040d8b5e6c1854c841a401ddd0cd8fd5054e09a)",?\s*$'''
]
