name: Encounter Lab Public CI

on:
  push:
    branches: [research-v2.2]
  pull_request:
    branches: [research-v2.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encounter-public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENCOUNTER_CI_PUBLIC: '1'
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
  STREAMLIT_SERVER_HEADLESS: 'true'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Linux OpenMP runtime
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install public runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Native dependency imports
        run: python -m pytest -q tests/test_environment.py
      - name: Collect complete public test inventory
        run: python -m pytest --collect-only -q
      - name: Full pytest without private data or live dataset HTTP
        run: python -m pytest -q

  streamlit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Linux OpenMP runtime
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install public runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: All navigation pages, empty states and interaction regressions
        run: >-
          python -m pytest -q
          tests/test_ui.py tests/test_asof_ui.py tests/test_time_machine_ui.py
          tests/test_time_machine_coverage.py tests/test_multisource_ui.py tests/test_window_ui.py
          tests/test_data_manager.py tests/test_dataset_catalog.py tests/test_training_ui.py tests/test_evaluation_ui.py

  repository-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install scanner tests only, no ML libraries
        run: python -m pip install pytest
      - name: Safety rejection tests
        run: python -m pytest -q tests/test_repository_safety.py
      - name: Actual tracked content and trusted frozen evidence
        run: python tools/check_repository_safety.py
      - name: Pinned Gitleaks, full history and tracked index
        run: python -m tools.run_secret_scan
